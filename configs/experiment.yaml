project:
  name: RuleGate
  stage: "2-go"
  inference_enabled: false
  design_inference_enabled: true  # Kaggle runner, design split only.
  locked_test_inference_enabled: false

data:
  root_env_var: RULEGATE_DATA_ROOT
  expected_policy_count: 9
  expected_design_count: 18
  expected_locked_test_count: 225
  preserve_exact_duplicates: true
  opaque_id_key: generated_per_run_or_private_trusted_runner_input
  expose_to_model:
    - opaque_request_id
    - text

model:
  id: meta-llama/Llama-3.1-8B-Instruct
  # Candidate pin: Hugging Face `main` resolved to this commit on 2026-11-11
  # (public API; last modified 2024-09-25). The Kaggle probe re-resolves it with
  # the authorized token and records the result before any measured run.
  revision: 0e9e39f249a16976918f6564b8830bc894c89659
  temperature: 0.0
  seed: 484654
  quantization: none  # Unquantized; fits 2 x T4 (2 x 15 GB) with device_map=auto.
  dtype: float16  # T4 (compute capability 7.5) has no native bfloat16.
  max_new_tokens: 128
  runtime: kaggle_gpu
  kaggle:
    kernel_slug: rulegate-runner
    accelerator: NvidiaTeslaT4
    private: true
    internet: true
    hf_token_secret: HF_TOKEN

methods:
  single_prompting:
    enabled: true
    prompt_template: single-prompting-v2-reimplementation
  full_sequential_both:
    enabled: true
    expected_policy_calls: 9
    prompt_template: sequential-both-v2-reimplementation
  plain_screening:
    enabled: false
  action_aware_screening:
    enabled: false
    verify_labels:
      - POSSIBLE
      - UNCERTAIN
    exclude_label: EXCLUDE
    invalid_screen_fallback: full_nine_policy_verification

evaluation:
  policy_ids: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  zero_f1_denominator: 0.0
  bootstrap:
    resamples: 10000
    seed: 484654
    confidence_level: 0.95
    paired_by_request: true
  h1:
    delta: mean_policy_f1_rulegate_minus_full_sequential_both
    noninferiority_margin: 0.05
    go_rule: ci_lower_strictly_greater_than_negative_margin
  h2:
    minimum_total_call_reduction: 0.50
    source: measured_backend_call_ledger

logging:
  raw_responses: local_review_required
  include_prompt_hash: true
  include_token_counts: true
  include_elapsed_time: true
  include_retries_and_fallbacks: true
